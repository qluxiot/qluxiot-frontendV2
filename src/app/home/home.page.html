<app-custom-header></app-custom-header>

<ion-content [fullscreen]="true" class="dashboard-content ion-padding">
  <main class="flex-1 px-gutter py-lg max-w-[1440px] mx-auto w-full flex flex-col h-full">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-md mb-xl flex-shrink-0">
      <div>
        
        <h1 class="text-display font-display text-on-surface m-0">Location Overview</h1>
      </div>
      <div class="flex flex-wrap items-center gap-md">
        <div *ngIf="isSuperAdmin && projects.length > 0" class="flex items-center gap-sm px-md py-2 bg-surface-container-lowest border border-outline-variant rounded-lg hover:border-primary transition-colors">
          <span class="material-symbols-outlined text-secondary text-[20px]">filter_alt</span>
          <span class="text-body-md font-body-md text-secondary">Project:</span>
          <select [(ngModel)]="selectedProjectId" (ngModelChange)="onProjectFilterChange()" class="text-body-md font-body-md font-semibold text-on-surface bg-transparent border-none focus:ring-0 p-0 cursor-pointer">
            <option [ngValue]="null">All Projects</option>
            <option *ngFor="let p of projects" [ngValue]="p.id">{{ p.name }}</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Map -->
    <div class="bg-white border border-outline-variant rounded-lg shadow-sm overflow-hidden flex-1 min-h-[500px]">
      <div id="map" class="w-full h-full relative z-[1]"></div>
    </div>

  </main>
</ion-content>
